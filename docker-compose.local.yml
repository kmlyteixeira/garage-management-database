services:
  postgres-os:
    image: postgres:16
    environment:
      POSTGRES_DB: os_service
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d os_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-billing:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d billing_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-execution:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: execution_service
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
